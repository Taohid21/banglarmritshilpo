<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>banglarmritshilpo.top</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background-color: #ffffff;
            color: #1f1f1f;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 36px 24px 24px 24px;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Chrome Sad Page Pixel Icon */
        .sad-icon {
            width: 44px;
            height: 48px;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            color: #1f1f1f;
            margin-bottom: 16px;
            line-height: 1.3;
            letter-spacing: -0.2px;
        }

        p.description {
            font-size: 14px;
            color: #444746;
            line-height: 1.5;
            margin-bottom: 24px;
            word-break: break-word;
        }

        p.description strong {
            font-weight: 700;
            color: #1f1f1f;
        }

        p.error-code {
            font-size: 11px;
            color: #70757a;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* Bottom Reload Button */
        .footer {
            width: 100%;
            padding-top: 16px;
        }

        .reload-btn {
            width: 100%;
            background-color: #0b57d0;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            outline: none;
        }

        .reload-btn:active {
            background-color: #0842a0;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Pixelated Sad Document Icon -->
        <svg class="sad-icon" viewBox="0 0 36 40" fill="#5f6368">
            <path d="M0 0v40h36V12L24 0H0zm4 4h18v10h10v22H4V4z"/>
            <rect x="10" y="18" width="4" height="4"/>
            <rect x="22" y="18" width="4" height="4"/>
            <path d="M12 30h12v-2H12v2zm-2-2h2v-2h-2v2zm14 0h2v-2h-2v2z"/>
        </svg>

        <h1>This page isn’t working</h1>

        <p class="description">
            <strong>banglarmritshilpo.top</strong> is currently unable to handle this request.
        </p>

        <p class="error-code">HTTP ERROR 500</p>
    </div>

    <!-- Reload Button at the bottom -->
    <div class="footer">
        <button class="reload-btn" onclick="location.reload()">Reload</button>
    </div>

</body>
</html>
