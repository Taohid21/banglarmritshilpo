<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>500 — Internal Server Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0F172A;
    --card-bg: rgba(30, 41, 59, 0.7);
    --border: rgba(255, 255, 255, 0.1);
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --accent-red: #EF4444;
    --accent-amber: #F59E0B;
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --font-main: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; background: var(--bg); font-family: var(--font-main); color: var(--text-main); display: flex; align-items: center; justify-content: center; padding: 1.25rem; overflow-x: hidden; }

  /* Background Glow Animations */
  .bg-glow {
    position: fixed; width: 350px; height: 350px; border-radius: 50%;
    background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 0;
  }

  /* Main Error Card Layout */
  .error-card {
    background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 20px; padding: 2.25rem 2rem;
    width: 100%; max-width: 520px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative; z-index: 1; text-align: center; animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Error Status Badge */
  .status-badge {
    display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3); color: var(--accent-red);
    padding: 0.35rem 0.85rem; border-radius: 99px; font-size: 0.78rem; font-weight: 800;
    font-family: var(--font-mono); text-transform: uppercase; margin-bottom: 1.5rem;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); animation: pulse 1.8s infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Server Alert Icon */
  .icon-wrapper {
    width: 64px; height: 64px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem; color: var(--accent-red);
  }

  .error-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; color: #FFF; }
  .error-subtitle { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem; }
  .domain-highlight { color: #FFF; font-weight: 700; font-family: var(--font-mono); word-break: break-all; }

  /* Action Buttons */
  .actions-group { display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  
  .btn {
    padding: 0.75rem 1.4rem; border-radius: 10px; font-size: 0.88rem; font-family: var(--font-main);
    font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    gap: 0.5rem; transition: all 0.15s ease; border: none; outline: none; min-height: 44px; text-decoration: none;
  }

  .btn-reload { background: var(--primary); color: #FFF; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3); flex: 1; min-width: 160px; }
  .btn-reload:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .btn-reload:active { transform: translateY(0); }

  .btn-secondary { background: rgba(255, 255, 255, 0.06); color: var(--text-main); border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }

  /* Developer Diagnostics Accordion */
  .diagnostics-box {
    background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.85rem 1rem; text-align: left; font-size: 0.8rem;
  }
  .diag-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--text-muted); font-weight: 700; user-select: none; }
  .diag-header:hover { color: #FFF; }
  .diag-content { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-family: var(--font-mono); color: var(--accent-amber); display: none; line-height: 1.6; font-size: 0.75rem; }
  .diag-content.open { display: block; }

  /* Spinner Animation */
  .spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .error-card { padding: 1.75rem 1.25rem; }
    .actions-group { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="error-card">
  <!-- Status Badge -->
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>HTTP ERROR 500</span>
  </div>

  <!-- Server Alert SVG Icon -->
  <div class="icon-wrapper">
    <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
    </svg>
  </div>

  <h1 class="error-title">This page isn't working</h1>
  <p class="error-subtitle">
    <span class="domain-highlight" id="domainName">editwp.com</span> is currently unable to handle this request or encountered an internal error.
  </p>

  <!-- Action Buttons -->
  <div class="actions-group">
    <button class="btn btn-reload" onclick="reloadPage(this)">
      <svg id="reloadIcon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.001 0 01-15.357-2m15.357 2H15"></path>
      </svg>
      <span>Reload Page</span>
    </button>
    <a href="/" class="btn btn-secondary">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
      </svg>
      <span>Home</span>
    </a>
  </div>

  <!-- Technical Diagnostics for Webmasters -->
  <div class="diagnostics-box">
    <div class="diag-header" onclick="toggleDiagnostics()">
      <span>Developer Diagnostics</span>
      <svg id="diagArrow" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </div>
    <div class="diag-content" id="diagContent">
      <div>[Server Alert]: PHP Execution Error / Database Connection Timeout.</div>
      <div style="margin-top:4px; color:var(--text-muted);">Check cPanel File Manager -> public_html / error_log or .htaccess file.</div>
    </div>
  </div>
</div>

<script>
  // Detect current Domain Name automatically
  document.addEventListener('DOMContentLoaded', () => {
    const domain = window.location.hostname || 'editwp.com';
    document.getElementById('domainName').innerText = domain;
  });

  // Reload button functionality with loading spinner
  function reloadPage(btn) {
    const icon = document.getElementById('reloadIcon');
    icon.classList.add('spinning');
    btn.style.opacity = '0.8';
    setTimeout(() => {
      window.location.reload();
    }, 600);
  }

  // Toggle developer diagnostics
  function toggleDiagnostics() {
    const content = document.getElementById('diagContent');
    const arrow = document.getElementById('diagArrow');
    content.classList.toggle('open');
    arrow.style.transform = content.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
  }
</script>

</body>
</html>
