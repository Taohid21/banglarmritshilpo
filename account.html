<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>আমার অ্যাকাউন্ট | Banglar Mirtshilpo</title>
    
    <link rel="icon" href="https://i.postimg.cc/cCKd21YV/FB-IMG-1751915283498-prev-ui.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --terracotta: #A64B2A;
            --clay-dark: #231612;
            --clay-ochre: #D3753B;
            --sand-bg: #F5EFE6;
            --card-bg: #FFFFFF;
            --border-color: #E2D5C3;
            --text-main: #2C1D18;
            --text-light: #6E5E58;
            --success: #10B981;
            --danger: #EF4444;
            --font-bn: 'Anek Bangla', sans-serif;
            --font-en: 'Poppins', sans-serif;
            --shadow-soft: 0 10px 25px rgba(35, 22, 18, 0.08);
            --shadow-card: 0 4px 15px rgba(166, 75, 42, 0.07);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-bn), var(--font-en), sans-serif;
            background-color: var(--sand-bg);
            background-image: radial-gradient(rgba(166, 75, 42, 0.05) 1px, transparent 1px), radial-gradient(rgba(35, 22, 18, 0.04) 1px, var(--sand-bg) 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation */
        .account-header {
            background-color: var(--clay-dark);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .account-header .logo img { height: 45px; width: auto; }

        .back-home-btn {
            color: #FFF;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 20px;
            transition: background 0.2s;
        }
        .back-home-btn:hover { background-color: var(--terracotta); }

        /* Main Wrapper Container */
        .main-container {
            flex: 1;
            max-width: 650px;
            width: 100%;
            margin: 30px auto;
            padding: 0 16px;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            background-color: #EDE5D8;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 16px;
            border: none;
            background: transparent;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--terracotta);
            border-bottom: 3px solid var(--terracotta);
        }

        .form-section { padding: 30px 24px; display: none; }
        .form-section.active { display: block; }

        .form-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--clay-dark);
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--clay-dark);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #FAF8F5;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--terracotta);
            background-color: #FFF;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 37px;
            cursor: pointer;
            color: var(--text-light);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--terracotta);
            color: #FFF;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .btn-submit:hover { background-color: var(--clay-ochre); }

        /* Dashboard Styles */
        .dashboard-container { display: none; animation: fadeIn 0.4s ease; }

        .profile-banner {
            background: linear-gradient(135deg, var(--clay-dark) 0%, #422920 100%);
            color: #FFF;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow-card);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .profile-banner::after {
            content: '';
            position: absolute;
            right: -20px; bottom: -20px;
            width: 100px; height: 100px;
            background: rgba(166, 75, 42, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }

        .avatar-circle {
            width: 75px; height: 75px;
            border-radius: 50%;
            background-color: var(--terracotta);
            color: #FFF;
            font-size: 2.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .user-details h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 2px; }
        .user-details p { font-size: 0.88rem; color: #D1C5C0; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .dash-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow-card);
        }

        .dash-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--clay-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .dash-card-title svg { width: 22px; height: 22px; stroke: var(--terracotta); }

        .action-links { display: grid; gap: 12px; }

        .dash-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background-color: #FAF8F5;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            color: var(--clay-dark);
            font-weight: 600;
            transition: all 0.2s;
        }

        .dash-link-btn:hover {
            background-color: var(--terracotta);
            color: #FFF;
            border-color: var(--terracotta);
        }

        .btn-logout {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }
        .btn-logout:hover {
            background-color: var(--danger);
            color: #FFF;
        }

        /* Toast Message System */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            background-color: var(--clay-dark);
            color: #FFF;
            font-size: 0.9rem;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            border-left: 4px solid var(--terracotta);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(0); }

        .loader {
            display: inline-block;
            width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- Navigation Header -->
    <header class="account-header">
        <a href="index.html" class="logo"><img src="Banglar_Mirtshilpo.png" alt="Logo"></a>
        <a href="index.html" class="back-home-btn">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            হোমে ফিরুন
        </a>
    </header>

    <main class="main-container">
        
        <!-- Auth Container (Login / Register) -->
        <div id="auth-wrapper" class="auth-card">
            <div class="tab-bar">
                <button class="tab-btn active" id="tab-login-btn">লগইন</button>
                <button class="tab-btn" id="tab-register-btn">নতুন অ্যাকাউন্ট</button>
            </div>

            <!-- Login Form -->
            <div id="login-section" class="form-section active">
                <h2 class="form-title">আপনার অ্যাকাউন্টে লগইন করুন</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">ইমেইল এড্রেস</label>
                        <input type="email" id="login-email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">পাসওয়ার্ড</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <span class="toggle-password" id="toggle-login-pass">👁️</span>
                    </div>
                    <div style="text-align: right; margin-bottom: 15px;">
                        <a href="#" id="forgot-pass-btn" style="color: var(--terracotta); font-size: 0.85rem; text-decoration: none; font-weight: 600;">পাসওয়ার্ড ভুলে গেছেন?</a>
                    </div>
                    <button type="submit" class="btn-submit" id="login-submit-btn">লগইন করুন</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-section" class="form-section">
                <h2 class="form-title">নতুন অ্যাকাউন্ট তৈরি করুন</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="reg-name">আপনার পূর্ণ নাম</label>
                        <input type="text" id="reg-name" placeholder="যেমন: আব্দুর রহমান" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-phone">মোবাইল নম্বর</label>
                        <input type="tel" id="reg-phone" placeholder="017XXXXXXXX" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">ইমেইল এড্রেস</label>
                        <input type="email" id="reg-email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                        <input type="password" id="reg-password" placeholder="••••••••" required minlength="6">
                    </div>
                    <button type="submit" class="btn-submit" id="reg-submit-btn">রেজিস্টার সম্পন্ন করুন</button>
                </form>
            </div>
        </div>

        <!-- Logged-in User Dashboard -->
        <div id="dashboard-wrapper" class="dashboard-container">
            <!-- Profile Banner Card -->
            <div class="profile-banner">
                <div id="user-avatar" class="avatar-circle">U</div>
                <div class="user-details">
                    <h2 id="dash-user-name">ব্যবহারকারী</h2>
                    <p id="dash-user-email">email@domain.com</p>
                    <p id="dash-user-phone" style="color: var(--clay-ochre); margin-top: 3px; font-weight: 600;">017XXXXXXXX</p>
                </div>
            </div>

            <div class="dashboard-grid">
                <!-- Profile Edit Form Card -->
                <div class="dash-card">
                    <div class="dash-card-title">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        প্রোফাইল তথ্য ও ঠিকানা আপডেট
                    </div>
                    <form id="update-profile-form">
                        <div class="form-group">
                            <label>আপনার নাম</label>
                            <input type="text" id="edit-name" required>
                        </div>
                        <div class="form-group">
                            <label>মোবাইল নম্বর</label>
                            <input type="tel" id="edit-phone" required>
                        </div>
                        <div class="form-group">
                            <label>স্থায়ী ডেলিভারি ঠিকানা (চেকআউটে অটো-ফিল হবে)</label>
                            <textarea id="edit-address" rows="3" placeholder="গ্রাম/রাস্তা, থানা, জেলা..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit" id="save-profile-btn" style="padding: 10px 18px; font-size: 0.95rem;">তথ্য সংরক্ষণ করুন</button>
                    </form>
                </div>

                <!-- Quick Navigation Action Links -->
                <div class="dash-card">
                    <div class="dash-card-title">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                        কাস্টমার মেনু
                    </div>
                    <div class="action-links">
                        <a href="orders.html" class="dash-link-btn">
                            <span>📦 আমার সকল অর্ডার ও ট্র্যাকিং</span>
                            <span>→</span>
                        </a>
                        <a href="https://wa.me/8801721393555" target="_blank" class="dash-link-btn">
                            <span>💬 কাস্টমার কেয়ার (WhatsApp)</span>
                            <span>→</span>
                        </a>
                        <button id="reset-password-btn" class="dash-link-btn" style="cursor: pointer; text-align: left; background: #FAF8F5;">
                            <span>🔒 পাসওয়ার্ড রিসেট ইমেইল পাঠান</span>
                            <span>→</span>
                        </button>
                        <button id="logout-btn" class="dash-link-btn btn-logout">
                            <span>🚪 অ্যাকাউন্ট থেকে লগ আউট</span>
                            <span>➔</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Firebase System Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut, 
            updateProfile,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getDatabase, 
            ref, 
            set, 
            get, 
            update 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
            authDomain: "new-all-f99f7.firebaseapp.com",
            databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
            projectId: "new-all-f99f7",
            storageBucket: "new-all-f99f7.firebasestorage.app",
            messagingSenderId: "1069748173900",
            appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const authWrapper = document.getElementById('auth-wrapper');
        const dashboardWrapper = document.getElementById('dashboard-wrapper');

        // Toast Notification System
        const showToast = (message, isError = false) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (isError) toast.style.borderLeftColor = 'var(--danger)';
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Tab Switch Logic
        const tabLoginBtn = document.getElementById('tab-login-btn');
        const tabRegisterBtn = document.getElementById('tab-register-btn');
        const loginSection = document.getElementById('login-section');
        const registerSection = document.getElementById('register-section');

        tabLoginBtn.addEventListener('click', () => {
            tabLoginBtn.classList.add('active');
            tabRegisterBtn.classList.remove('active');
            loginSection.classList.add('active');
            registerSection.classList.remove('active');
        });

        tabRegisterBtn.addEventListener('click', () => {
            tabRegisterBtn.classList.add('active');
            tabLoginBtn.classList.remove('active');
            registerSection.classList.add('active');
            loginSection.classList.remove('active');
        });

        // Toggle Password visibility
        document.getElementById('toggle-login-pass').addEventListener('click', function() {
            const passInput = document.getElementById('login-password');
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            this.textContent = isPass ? '🙈' : '👁️';
        });

        // Auth State Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authWrapper.style.display = 'none';
                dashboardWrapper.style.display = 'block';

                // Set default info from Auth Profile
                const name = user.displayName || 'ব্যবহারকারী';
                document.getElementById('dash-user-name').textContent = name;
                document.getElementById('dash-user-email').textContent = user.email;
                document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();

                // Fetch Database Extended User Data
                try {
                    const userSnap = await get(ref(db, `users/${user.uid}`));
                    if (userSnap.exists()) {
                        const data = userSnap.val();
                        document.getElementById('dash-user-phone').textContent = data.phone || 'মোবাইল নম্বর যুক্ত নেই';
                        document.getElementById('edit-name').value = data.name || name;
                        document.getElementById('edit-phone').value = data.phone || '';
                        document.getElementById('edit-address').value = data.address || '';
                    } else {
                        document.getElementById('edit-name').value = name;
                    }
                } catch (err) {
                    console.error("User data fetch error:", err);
                }
            } else {
                authWrapper.style.display = 'block';
                dashboardWrapper.style.display = 'none';
            }
        });

        // Registration Logic
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reg-submit-btn');
            btn.innerHTML = '<span class="loader"></span> প্রক্রিয়াকরণ হচ্ছে...';
            btn.disabled = true;

            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await updateProfile(user, { displayName: name });
                await set(ref(db, `users/${user.uid}`), {
                    name: name,
                    phone: phone,
                    email: email,
                    createdAt: new Date().toISOString()
                });

                showToast('অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!');
            } catch (error) {
                let msg = 'রেজিস্ট্রেশন ব্যর্থ হয়েছে। আবার চেষ্টা করুন।';
                if (error.code === 'auth/email-already-in-use') msg = 'এই ইমেইল দিয়ে ইতোমধ্যে অ্যাকাউন্ট আছে!';
                showToast(msg, true);
            } finally {
                btn.innerHTML = 'রেজিস্টার সম্পন্ন করুন';
                btn.disabled = false;
            }
        });

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            btn.innerHTML = '<span class="loader"></span> লগইন হচ্ছে...';
            btn.disabled = true;

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast('সফলভাবে লগইন হয়েছে!');
            } catch (error) {
                showToast('আপনার ইমেইল অথবা পাসওয়ার্ড সঠিক নয়!', true);
            } finally {
                btn.innerHTML = 'লগইন করুন';
                btn.disabled = false;
            }
        });

        // Save/Update Profile Logic
        document.getElementById('update-profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const btn = document.getElementById('save-profile-btn');
            btn.innerHTML = '<span class="loader"></span> সেভ হচ্ছে...';
            btn.disabled = true;

            const newName = document.getElementById('edit-name').value.trim();
            const newPhone = document.getElementById('edit-phone').value.trim();
            const newAddress = document.getElementById('edit-address').value.trim();

            try {
                await updateProfile(user, { displayName: newName });
                await update(ref(db, `users/${user.uid}`), {
                    name: newName,
                    phone: newPhone,
                    address: newAddress,
                    updatedAt: new Date().toISOString()
                });

                document.getElementById('dash-user-name').textContent = newName;
                document.getElementById('dash-user-phone').textContent = newPhone;
                document.getElementById('user-avatar').textContent = newName.charAt(0).toUpperCase();

                showToast('প্রোফাইল তথ্য সফলভাবে সংরক্ষণ হয়েছে!');
            } catch (err) {
                showToast('তথ্য আপডেট করতে সমস্যা হয়েছে।', true);
            } finally {
                btn.innerHTML = 'তথ্য সংরক্ষণ করুন';
                btn.disabled = false;
            }
        });

        // Forgot & Reset Password
        const handleResetPassword = async () => {
            const user = auth.currentUser;
            const email = user ? user.email : prompt("আপনার ইমেইল এড্রেস লিখুন:");
            if (!email) return;

            try {
                await sendPasswordResetEmail(auth, email);
                showToast(`পাসওয়ার্ড রিসেট লিংক ${email} এ পাঠানো হয়েছে!`);
            } catch (err) {
                showToast('পাসওয়ার্ড রিসেট ইমেইল পাঠাতে ব্যর্থ হয়েছে।', true);
            }
        };

        document.getElementById('forgot-pass-btn').addEventListener('click', (e) => {
            e.preventDefault();
            handleResetPassword();
        });

        document.getElementById('reset-password-btn').addEventListener('click', handleResetPassword);

        // Logout Logic
        document.getElementById('logout-btn').addEventListener('click', async () => {
            if (confirm('আপনি কি নিশ্চিত যে লগ আউট করতে চান?')) {
                await signOut(auth);
                showToast('লগ আউট সম্পন্ন হয়েছে।');
            }
        });

    </script>
</body>
</html>
